# Krea2 male-only aging v1: ungenerated, untrained counterpart of the female paired prompts.
# Same 3 clothing/background scenes and framing: full-body x2 and waist-up x4.
# Male-first descriptions change only the skin sentence between baseline and positive.
# The male target has no fixed numerical age; the protected woman is in her thirties.
# Female-only image results do not establish male-only selectivity.
# target == negative == neutral; positive describes the requested aging direction.
# Hair, build, clothing, pose, framing and the other person are shared within each record.
# Each person is on the left in 3 records and on the right in 3 records.
# Use training_direction=single; positive LoRA weights aim toward the positive prompt.
# Node settings are not controlled by this YAML; see prompts/README.md.
# Negative is a teacher comparison prompt, not a generation exclusion list.

# 0: scene 01, full-body; woman left, man right
- target: >-
    A detailed, photorealistic color studio photograph with natural skin texture and realistic fabric detail
    depicts exactly two fully clothed adults. An adult man stands on the right beside an adult woman. The skin
    on the man's face, neck and hands is smooth. The man has an average adult build, natural adult
    head-to-body proportions, short dark hair, and a clean-shaven face. He wears an opaque teal short-sleeved
    shirt, khaki trousers, and brown shoes. The woman stands on the left. She is in her thirties, with an
    average adult build, natural adult head-to-body proportions, an oval face, dark brown, shoulder-length
    straight hair, and smooth skin on her face, neck and hands. She wears an opaque orange short-sleeved
    blouse tucked into dark denim trousers, with white trainers. Both stand upright at the same distance from
    the camera, with level relaxed shoulders, neutral expressions, and a clear gap between them. Both look
    toward the camera. Their arms rest at their sides, with their hands clearly visible. A frontal view shows
    both complete bodies from head to toe, including both pairs of shoes and the level studio floor. There is
    a little space above their heads. The background is a plain cream studio wall and a light floor. The scene
    has natural, balanced colors and soft, even lighting.
