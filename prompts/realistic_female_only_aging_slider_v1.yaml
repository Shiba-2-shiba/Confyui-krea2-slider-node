# Krea2 female-only aging v1: paired adults, photographic skin aging.
# Prompt bodies are copied exactly from docs/realistic-female-only-aging-prompt-candidates-v1.txt.
# Source: 3 scenes with left/right variants; full-body x2 and waist-up x4.
# Reviewed 35 images (17 complete same-seed pairs) with darkbrush=0.8 at 1024x1024.
# Female aging was visible with no obvious male aging; hair, clothing and pose drift remained.
# Nine reviewed aged prompts also contained END PROMPT; no delimiter is included here.
# Selectivity without auxiliary LoRAs, and after Slider training, has not been visually validated.
# target == negative == neutral; positive describes the requested aging direction.
# Hair, build, clothing, pose, framing and the other person are shared within each record.
# Each person is on the left in 3 records and on the right in 3 records.
# Use training_direction=single; positive LoRA weights aim toward the positive prompt.
# Node settings are not controlled by this YAML; see prompts/README.md.
# Negative is a teacher comparison prompt, not a generation exclusion list.

# 0: scene 01, full-body; woman left, man right
- target: >-
    A detailed, photorealistic color studio photograph with natural skin texture and realistic fabric detail
    depicts exactly two fully clothed adults. An adult woman stands on the left beside an adult man. The skin
    on the woman's face, neck and hands is smooth. The woman has an average adult build, natural adult
    head-to-body proportions, an oval face, and dark brown, shoulder-length straight hair. She wears an opaque
    orange short-sleeved blouse tucked into dark denim trousers, with white trainers. The man stands on the
    right. He is in his thirties, with short dark hair, a clean-shaven face, smooth skin on his face, neck and
    hands, and an average adult build. He wears an opaque teal short-sleeved shirt, khaki trousers, and brown
    shoes. Both stand upright at the same distance from the camera, with level relaxed shoulders, neutral
    expressions, and a clear gap between them. Both look toward the camera. Their arms rest at their sides,
    with their hands clearly visible. A frontal view shows both complete bodies from head to toe, including
    both pairs of shoes and the level studio floor. There is a little space above their heads. The background
    is a plain cream studio wall and a light floor. The scene has natural, balanced colors and soft, even
    lighting.
