# Krea2 female size decrease v2: provisional revision after the 10-candidate image review.
# Positive LoRA weights aim to decrease the adult woman's whole-body scale relative to the adult man.
# target == negative == neutral: ordinary-size baseline; positive is the requested direction.
# The opposite extreme is not used as a negative teacher; the earlier miniature prompts produced extra people.
# Female-first wording and left/right placement are motivated by candidates 06 and 08; wording is revised.
# Very short/tall is the primary cue, with approximate half/twice height and head/waist alignment as secondary cues.
# Six records are three clothing/background scenes with left/right variants, not six independent validated scenes.
# Within each record, only the two female-stature sentences differ between baseline and positive.
# Male description, clothing, pose, camera, background and adult proportions are shared across roles.
# Start with single direction, eta=1, teacher_guidance_scale=1, teacher_norm_reference=none.
# At that scale the teacher equals the positive prediction because target equals negative.
# This changes wording and teacher construction from v1; improvements cannot be attributed to wording alone.
# The reviewed images used darkbrush=0.8 and one seed. This v2 text has not been generated or trained.
# The exact 0.5/2.0 height ratios and retention of the male figure are not established.

