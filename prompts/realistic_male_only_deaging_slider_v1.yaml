# Krea2 male-only deaging v1: adult-to-toddler transformation in a two-person scene.
# Age/proportion cues follow realistic_deaging_slider_fullbody_v2.yaml.
# Positive weights aim to transform only the man into a toddler boy.
# The other person remains an adult in their thirties in all prompt roles.
# Six full-body records: three clothing/background scenes with left/right variants.
# Full-body framing keeps the child-height figure and the companion visible together.
# Within each record, only the target age/proportion block changes.
# Hair, clothing design, body-fitting clothes, pose, camera and background are shared.
# target == negative == neutral; positive is deaging, not an elderly-skin reversal.
# Use single, eta=1, teacher_guidance_scale=1, teacher_norm_reference=none as starting values.
# These controls are node settings; the YAML does not apply them automatically.
# Negative is a teacher comparison prompt, not a generation exclusion list.
# New prompt candidates: neither generation nor training/selectivity has been validated.
# Female-only aging image results do not validate either deaging direction.

