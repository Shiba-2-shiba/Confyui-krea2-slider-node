# Krea2 realistic deaging: photographic counterpart of anime_deaging_slider_fullbody.yaml.
# Original six age-contrast records, clothing, poses, camera framing, and lighting are retained.
# All prompt roles use the same photographic rendering and natural skin/fabric detail.
# target == negative == neutral: original adult baseline; positive is the age transformation.
# aging changes adult facial/neck/hand skin; deaging changes adult to toddler proportions.
# Use training_direction=single; positive LoRA weights move toward the positive age description.
# negative is a teacher comparison prompt, not a generation exclusion list.
# Training settings are selected on the node; no training or image-quality evaluation yet.

- target: >-
    A detailed, photorealistic studio photograph with natural skin texture and realistic fabric detail depicts an adult woman with
    natural adult head-to-body proportions, adult-length arms and legs, fully grown shoulders and adult-sized
    hands. She has dark brown, shoulder-length straight hair and a natural, balanced build for her age.
    She wears a modest dark gray blouse with a plain round neckline and straight short sleeves ending
    halfway down her upper arms. The blouse has a straight hem fully tucked into the skirt. She wears
    a plain ankle-length dark skirt with a flat waistband at her waist, straight side seams and a straight
    hem. Her clothes are made of opaque matte fabric and are sized to fit her own body, with the shoulder
    seams at her shoulders and a comfortable regular fit around her torso and arms. The clothing has a
    simple straight silhouette, clear seam lines and correctly placed sleeve and hem edges. She is fully
    clothed and alone in a nonsexual composition, with a neutral expression, upright posture and level
    relaxed shoulders. She wears plain matte black flat slip-on shoes fitted to her feet. Her arms rest
    at her sides and her hands are clearly visible. A centered front view shows her entire body from head
    to toe, including both feet and the studio floor. She looks toward the viewer. The setting is a bright
    neutral studio with a plain pale gray wall and a bright floor. The scene has a neutral color palette,
    soft even lighting, restrained highlights and natural skin texture.
