# Krea2 clothing fit loosen v2: opposite fit poles around a regular-fit baseline.
# Revised from clothing_fit_loosen_slider.yaml; original baseline-comparison prompts remain available.
# target == neutral: regular fit; positive/negative describe opposite clothing fit.
# positive: loose fit; negative: close fit.
# Use training_direction=single; positive LoRA weights move toward the positive fit.
# Only the two clothing-fit sentences differ between fields in each record.
# Fit is described by fabric-to-body space, waist outline, and sleeve width.
# Layered cardigans and jackets fit over the underlying top.
# Garment type, color, body, pose, framing, background, and lighting are shared within each record.
# Tops are visible through their lower outline; the dress is visible through its hem.
# Natural-language style and folded YAML blocks follow breast_size_slider_v2.yaml.
# negative is a teacher comparison prompt, not a generation exclusion list.
# Six training records; no held-out evaluation records or node settings are embedded.
# Keep the training settings unchanged initially to compare the prompt revision.
# Training and image quality have not been evaluated.

# 0: training; blouse, centered front view, head to below hips.
- target: >-
    A clean 2D anime illustration with soft cel shading shows a single adult woman.
    The blouse has a regular fit with moderate fabric allowance around her torso and upper arms. Its side outline leaves a small amount of room at the waist, and the sleeves have ordinary width around her arms.
    She has an average build, medium-width shoulders, a defined waist, medium-width hips, and moderately slender arms.
    Her shoulder-length dark brown hair rests behind her shoulders.
    She wears a plain, opaque, charcoal blouse with a high round neckline and long sleeves, and dark straight-leg trousers.
